name: Gameplay Rally V2

on:
  push:
    branches:
      - chatgpt/gameplay-rally-v2

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gameplay-rally-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply gameplay patch
        run: |
          sed -i 's/gap < 1.82/gap < 2.6/' scripts/gameplay-rally-v2.py
          python scripts/gameplay-rally-v2.py

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gameplay-rally-v2.yml scripts/gameplay-rally-v2.py
          git add index.html src public tests
          git commit -m "Fix iPhone zoom and add rally counter loop"
          git push origin HEAD:chatgpt/gameplay-rally-v2
