name: Gameplay Rally V2

on:
  push:
    branches: [chatgpt/gameplay-rally-v2]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gameplay-rally-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply mobile and gameplay overhaul
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement target in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "index.html",
              '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />',
          )

          replace(
              "src/styles.css",
              '''html, body, #app {\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  overflow: hidden;\n}''',
              '''html, body, #app {\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  overflow: hidden;\n  touch-action: none;\n}\n\nhtml {\n  overscroll-behavior: none;\n  -webkit-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n}''',
          )

          replace(
              "src/styles.css",
              '''body {\n  background: #030611;\n  color: var(--ink);\n  overscroll-behavior: none;\n  user-select: none;\n  -webkit-user-select: none;\n  -webkit-touch-callout: none;\n}''',
              '''body {\n  position: fixed;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  background: #030611;\n  color: var(--ink);\n  overscroll-behavior: none;\n  user-select: none;\n  -webkit-user-select: none;\n  -webkit-touch-callout: none;\n  touch-action: none;\n}''',
          )

          replace(
              "src/styles.css",
              '''button { color: inherit; font: inherit; }''',
              '''button { color: inherit; font: inherit; touch-action: none; -webkit-tap-highlight-color: transparent; }''',
          )

          replace(
              "src/main.ts",
              '<span class="team-note">BALL = CATCH / AIM / THROW</span>',
              '<span class="team-note">CATCH / DASH → COUNTER</span>',
          )

          replace(
              "src/main.ts",
              '''        <p>BALL長押しで敵を狙い、離して投球。飛んできた球にはBALLタップでキャッチ。PASSすると味方が役割別の一撃だけを放つ。</p>''',
              '''        <p>敵の予告を読み、BALLでキャッチかDASHで奪取。成功するほどRALLYが伸び、直後のカウンターが高速・高威力になる。PASSはRALLYを味方の必殺攻撃へ変換。</p>''',
          )

          replace(
              "src/main.ts",
              '''  const blue = teamStats("blue");\n  const red = teamStats("red");\n  if (blueAlive) blueAlive.textContent = `${blue.alive} / 3`;''',
              '''  const blue = teamStats("blue");\n  const red = teamStats("red");\n  const controlled = snapshot.players.find((player) => player.id === snapshot.controlledPlayerId);\n  if (matchLabel && !matchLabel.classList.contains("is-fallback")) {\n    matchLabel.textContent = controlled && controlled.combo > 0\n      ? `RALLY x${controlled.combo} // ${snapshot.momentum >= 80 ? "SURGE" : "COUNTER UP"}`\n      : "PLAYER LED // 3v3";\n  }\n  if (blueAlive) blueAlive.textContent = `${blue.alive} / 3`;''',
          )

          replace(
              "src/main.ts",
              '''window.addEventListener("contextmenu", (event) => event.preventDefault());\n\nif ("serviceWorker" in navigator) {''',
              '''window.addEventListener("contextmenu", (event) => event.preventDefault());\n\n// iPhone Safari can still interpret rapid action-button taps as page zoom even when\n// the game surface uses touch-action:none. Block native zoom gestures at document level.\nconst blockNativeZoom = (event: Event): void => event.preventDefault();\ndocument.addEventListener("gesturestart", blockNativeZoom, { passive: false });\ndocument.addEventListener("gesturechange", blockNativeZoom, { passive: false });\ndocument.addEventListener("gestureend", blockNativeZoom, { passive: false });\ndocument.addEventListener("touchmove", (event) => {\n  if (event.touches.length > 1) event.preventDefault();\n}, { passive: false });\nlet lastTouchEndAt = 0;\ndocument.addEventListener("touchend", (event) => {\n  const now = performance.now();\n  if (now - lastTouchEndAt < 320) event.preventDefault();\n  lastTouchEndAt = now;\n}, { passive: false, capture: true });\ndocument.addEventListener("dblclick", blockNativeZoom, { passive: false });\n\nif ("serviceWorker" in navigator) {''',
          )

          replace("src/game/simulation.ts", 'const BALL_CATCH_DISTANCE = 1.62;', 'const BALL_CATCH_DISTANCE = 1.85;\nconst PERFECT_CATCH_DISTANCE = 0.92;')
          replace("src/game/simulation.ts", 'const ENEMY_HOLD_BEFORE_AIM = 0.5;', 'const ENEMY_HOLD_BEFORE_AIM = 0.2;')
          replace("src/game/simulation.ts", 'const HUMAN_AIM_CHARGE_SECONDS = 0.82;', 'const HUMAN_AIM_CHARGE_SECONDS = 0.52;')
          replace("src/game/simulation.ts", '      speedScale *= 0.24;', '      speedScale *= 0.62;')

          replace(
              "src/game/simulation.ts",
              '''      const kind = this.humanThrowKind(input, this.snapshotState.aimCharge);\n      const chargeBonus = 1 + this.snapshotState.aimCharge * 0.16;\n      this.throwBallAt(player, target, kind, chargeBonus);''',
              '''      const kind = this.humanThrowKind(input, this.snapshotState.aimCharge);\n      const rallyBonus = 1 + Math.min(player.combo, 6) * 0.08;\n      const surgeBonus = this.snapshotState.momentum >= 80 ? 1.18 : 1;\n      const chargeBonus = (1 + this.snapshotState.aimCharge * 0.18) * rallyBonus * surgeBonus;\n      this.throwBallAt(player, target, kind, chargeBonus);''',
          )

          replace(
              "src/game/simulation.ts",
              '''    const totalSeconds = teammate.role === "SPEED" ? 0.24 : teammate.role === "POWER" ? 0.4 : 0.32;''',
              '''    const totalSeconds = teammate.role === "SPEED" ? 0.18 : teammate.role === "POWER" ? 0.3 : 0.24;''',
          )

          replace(
              "src/game/simulation.ts",
              '''    const damageBonus = telegraph.source === "ASSIST" ? 1.1 : 1;\n    this.snapshotState.telegraph = null;''',
              '''    const leader = this.findPlayer(this.snapshotState.controlledPlayerId);\n    const assistRallyBonus = 1 + Math.min(leader?.combo ?? 0, 6) * 0.06;\n    const damageBonus = telegraph.source === "ASSIST" ? 1.12 * assistRallyBonus : 1;\n    this.snapshotState.telegraph = null;''',
          )

          replace(
              "src/game/simulation.ts",
              '''    const totalSeconds = owner.role === "SPEED" ? 0.62 : owner.role === "POWER" ? 0.86 : 0.76;''',
              '''    const totalSeconds = owner.role === "SPEED" ? 0.48 : owner.role === "POWER" ? 0.68 : 0.58;''',
          )

          replace(
              "src/game/simulation.ts",
              '''    const speed = kind === "RUSH" ? 15.8 : kind === "STRAIGHT" ? 12.7 : kind === "CURVE" ? 11.3 : 10;\n    const baseDamage = kind === "SKY" ? 35 : kind === "RUSH" ? 32 : kind === "CURVE" ? 25 : 28;''',
              '''    const baseSpeed = kind === "RUSH" ? 15.8 : kind === "STRAIGHT" ? 12.7 : kind === "CURVE" ? 11.3 : 10;\n    const rallyLeader = player.team === "blue" ? this.findPlayer(this.snapshotState.controlledPlayerId) : null;\n    const rallyStack = Math.min(rallyLeader?.combo ?? 0, 6);\n    const speedMultiplier = 1 + rallyStack * 0.045 + (this.snapshotState.momentum >= 80 && player.team === "blue" ? 0.08 : 0);\n    const speed = baseSpeed * speedMultiplier;\n    const baseDamage = kind === "SKY" ? 35 : kind === "RUSH" ? 32 : kind === "CURVE" ? 25 : 28;''',
          )

          replace(
              "src/game/simulation.ts",
              '''    player.throwCooldown = player.role === "POWER" ? 0.38 : 0.3;\n    player.lastAction = `${kind}_THROW`;\n    this.emit("throw", player.id, target.id, ball.position, damage, `${kind} THROW`, kind);''',
              '''    player.throwCooldown = player.role === "POWER" ? 0.34 : 0.26;\n    const rallyLabel = player.team === "blue" && rallyStack > 0 ? ` COUNTER x${rallyStack}` : "";\n    player.lastAction = `${kind}${rallyLabel}`;\n    this.emit("throw", player.id, target.id, ball.position, damage, `${kind}${rallyLabel}`, kind);''',
          )

          replace(
              "src/game/simulation.ts",
              '''        if (distance(player.position, ball.position) > BALL_CATCH_DISTANCE) continue;\n        ball.mode = "HELD";\n        ball.ownerId = player.id;\n        ball.throwerId = null;\n        ball.velocity = { x: 0, z: 0 };\n        ball.age = 0;\n        ball.heldSeconds = 0;\n        player.catchCooldown = 0.34;\n        player.combo += 1;\n        player.lastAction = player.id === this.snapshotState.controlledPlayerId ? "PERFECT CATCH" : "CATCH";\n        if (player.id === this.snapshotState.controlledPlayerId) {\n          this.snapshotState.momentum = clamp(this.snapshotState.momentum + 14, 0, 100);\n        }\n        this.emit("catch", player.id, null, player.position, player.combo, player.lastAction);\n        return;''',
              '''        const catchDistance = distance(player.position, ball.position);\n        if (catchDistance > BALL_CATCH_DISTANCE) continue;\n        ball.mode = "HELD";\n        ball.ownerId = player.id;\n        ball.throwerId = null;\n        ball.velocity = { x: 0, z: 0 };\n        ball.age = 0;\n        ball.heldSeconds = 0;\n        player.catchCooldown = 0.24;\n        player.combo = Math.min(player.combo + 1, 9);\n        const controlledCatch = player.id === this.snapshotState.controlledPlayerId;\n        const perfect = controlledCatch && catchDistance <= PERFECT_CATCH_DISTANCE;\n        player.lastAction = controlledCatch\n          ? `${perfect ? "PERFECT" : "CATCH"}! RALLY x${player.combo}`\n          : "CATCH";\n        if (controlledCatch) {\n          this.snapshotState.momentum = clamp(this.snapshotState.momentum + (perfect ? 26 : 15), 0, 100);\n        }\n        this.emit("catch", player.id, null, player.position, player.combo, player.lastAction);\n        return;''',
          )

          replace(
              "src/game/simulation.ts",
              '''        if (player.dashSeconds > 0) {\n          ball.mode = "FREE";\n          ball.ownerId = null;\n          ball.throwerId = null;\n          ball.velocity = { x: -ball.velocity.x * 0.28, z: -ball.velocity.z * 0.28 };\n          ball.heldSeconds = 0;\n          player.lastAction = "DODGE";\n          this.emit("dodge", player.id, null, player.position, 0, "DODGE");\n          return;\n        }''',
              '''        if (player.dashSeconds > 0) {\n          if (player.id === this.snapshotState.controlledPlayerId) {\n            ball.mode = "HELD";\n            ball.ownerId = player.id;\n            ball.throwerId = null;\n            ball.position = cloneVec(player.position);\n            ball.velocity = { x: 0, z: 0 };\n            ball.age = 0;\n            ball.heldSeconds = 0;\n            player.combo = Math.min(player.combo + 1, 9);\n            player.lastAction = `DASH STEAL! RALLY x${player.combo}`;\n            this.snapshotState.momentum = clamp(this.snapshotState.momentum + 12, 0, 100);\n            this.emit("dodge", player.id, null, player.position, player.combo, player.lastAction);\n          } else {\n            ball.mode = "FREE";\n            ball.ownerId = null;\n            ball.throwerId = null;\n            ball.velocity = { x: -ball.velocity.x * 0.28, z: -ball.velocity.z * 0.28 };\n            ball.heldSeconds = 0;\n            player.lastAction = "DODGE";\n            this.emit("dodge", player.id, null, player.position, 0, "DODGE");\n          }\n          return;\n        }''',
          )

          replace(
              "src/game/simulation.ts",
              '''    this.snapshotState.momentum = clamp(this.snapshotState.momentum + (player.team === "red" ? 10 : -8), 0, 100);''',
              '''    this.snapshotState.momentum = clamp(this.snapshotState.momentum + (player.team === "red" ? 14 : -20), 0, 100);''',
          )

          replace(
              "public/sw.js",
              'const CACHE_VERSION = "v4-player-led-rally";',
              'const CACHE_VERSION = "v5-rally-counter";',
          )

          test_path = Path("tests/simulation.test.ts")
          test_text = test_path.read_text()
          test_text += r'''

test("catching an enemy return builds rally and momentum", () => {
  const simulation = new BattleBallSimulation();
  simulation.step(aimInput);
  simulation.step(releaseInput);
  let caught = false;
  for (let tick = 0; tick < 1200; tick += 1) {
    const before = simulation.snapshot();
    const controlled = before.players.find((player) => player.id === before.controlledPlayerId);
    const incoming = before.ball.mode === "FLYING" && before.ball.throwerId?.startsWith("red-");
    const gap = controlled ? Math.hypot(controlled.position.x - before.ball.position.x, controlled.position.z - before.ball.position.z) : Infinity;
    simulation.step(incoming && gap < 1.82 ? { ...EMPTY_INPUT, ballPressed: true, ballHeld: true } : EMPTY_INPUT);
    const after = simulation.snapshot();
    const player = after.players.find((candidate) => candidate.id === after.controlledPlayerId);
    if (after.ball.ownerId === after.controlledPlayerId && (player?.combo ?? 0) > 0) {
      assert.ok(after.momentum >= 15);
      assert.match(player?.lastAction ?? "", /RALLY x/);
      caught = true;
      break;
    }
  }
  assert.equal(caught, true);
});
'''
          test_path.write_text(test_text)

          Path("tests/mobile-shell.test.ts").write_text(r'''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";

const indexHtml = readFileSync(new URL("../index.html", import.meta.url), "utf8");
const mainTs = readFileSync(new URL("../src/main.ts", import.meta.url), "utf8");
const styles = readFileSync(new URL("../src/styles.css", import.meta.url), "utf8");

test("iPhone viewport and native zoom gestures are locked for gameplay", () => {
  assert.match(indexHtml, /maximum-scale=1/);
  assert.match(indexHtml, /user-scalable=no/);
  assert.match(mainTs, /gesturestart/);
  assert.match(mainTs, /touches\.length > 1/);
  assert.match(mainTs, /lastTouchEndAt/);
  assert.match(styles, /touch-action:\s*none/);
});
''')
          PY

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --check

      - name: Commit validated gameplay overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gameplay-rally-v2.yml
          git add index.html src public tests
          git commit -m "Fix iPhone zoom and add rally counter loop"
          git push origin HEAD:chatgpt/gameplay-rally-v2
