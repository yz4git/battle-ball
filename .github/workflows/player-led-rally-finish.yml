name: Finish player-led rally

on:
  push:
    branches: [chatgpt/player-led-rally]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/player-led-rally
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply final fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f"missing target in {path}: {old[:100]!r}")
                  return
              p.write_text(text.replace(old, new))

          replace(
              "src/main.ts",
              'const canvas = app.querySelector<HTMLCanvasElement>("#game-canvas");\nif (!canvas) throw new Error("BATTLE BALL canvas is missing");',
              'const canvasElement = app.querySelector<HTMLCanvasElement>("#game-canvas");\nif (!canvasElement) throw new Error("BATTLE BALL canvas is missing");\nconst canvas: HTMLCanvasElement = canvasElement;',
          )

          replace(
              "src/game/simulation.ts",
              '      speedScale *= 0.24;',
              '      speedScale *= 0.08;',
              required=False,
          )

          replace(
              "src/game/webgl-demo.ts",
              '''      visual.body.material.emissiveIntensity = player.stunSeconds > 0 ? 3.4 : 1.2;\n      visual.ring.material.opacity = player.stunSeconds > 0 ? 0.98 : 0.66;\n      visual.ring.scale.setScalar(player.stunSeconds > 0 ? 1.12 + Math.sin(snapshot.clockSeconds * 22) * 0.08 : 1);''',
              '''      const isAimTarget = snapshot.aimTargetId === player.id;\n      const isTelegraphThrower = snapshot.telegraph?.throwerId === player.id;\n      const isTelegraphTarget = snapshot.telegraph?.targetId === player.id;\n      visual.body.material.emissiveIntensity = player.stunSeconds > 0 ? 3.4 : isTelegraphThrower ? 2.5 : isAimTarget ? 2.1 : 1.2;\n      visual.ring.material.color.setHex(isAimTarget ? 0xffd36a : isTelegraphThrower ? 0xff547d : isTelegraphTarget ? 0xffffff : TEAM_COLORS[player.team]);\n      visual.ring.material.opacity = player.stunSeconds > 0 || isAimTarget || isTelegraphThrower || isTelegraphTarget ? 0.98 : 0.66;\n      const tacticalPulse = isTelegraphThrower\n        ? 1.22 + Math.sin(snapshot.clockSeconds * 18) * 0.13\n        : isAimTarget\n          ? 1.16 + Math.sin(snapshot.clockSeconds * 12) * 0.08\n          : isTelegraphTarget\n            ? 1.12 + Math.sin(snapshot.clockSeconds * 20) * 0.06\n            : 1;\n      visual.ring.scale.setScalar(player.stunSeconds > 0 ? 1.12 + Math.sin(snapshot.clockSeconds * 22) * 0.08 : tacticalPulse);''',
          )

          replace(
              "scripts/webgl-audit.mjs",
              '''const throwButton = page.getByRole("button", { name: /THROW J/i });\nawait throwButton.click();''',
              '''const ballButton = page.locator('button[data-action="ball"]');\nawait ballButton.click();''',
              required=False,
          )

          replace(
              ".github/workflows/webgl-audit.yml",
              '''      - "scripts/webgl-audit.mjs"\n      - ".github/workflows/webgl-audit.yml"''',
              '''      - "src/**"\n      - "tests/**"\n      - "public/**"\n      - "scripts/webgl-audit.mjs"\n      - ".github/workflows/webgl-audit.yml"''',
              required=False,
          )
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/webgl-audit.mjs .github/workflows/webgl-audit.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish player-led rally feedback"
          git push origin HEAD:chatgpt/player-led-rally
